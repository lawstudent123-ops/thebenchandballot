<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>
<a href="profile.html">Profile</a>

</nav>

</header>





<section class="write-section">


<h1 id="welcome">
Loading...
</h1>



<div id="profile">

<p>
Loading profile...
</p>

</div>





<h2>
Articles
</h2>



<div id="articles">

<p>
Loading articles...
</p>

</div>




<br>


<button id="logout">
Log Out
</button>



</section>









<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";



import {

getAuth,

onAuthStateChanged,

signOut

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";



import {

getFirestore,

collection,

query,

where,

getDocs,

doc,

getDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";







const firebaseConfig = {

apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};






const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);





const profileDiv =
document.getElementById("profile");


const articlesDiv =
document.getElementById("articles");


const welcome =
document.getElementById("welcome");


const logout =
document.getElementById("logout");







// GET PROFILE ID FROM URL


const params =
new URLSearchParams(window.location.search);



let profileID =
params.get("id");







// IF NO ID, SHOW LOGGED IN USER PROFILE


onAuthStateChanged(auth,(user)=>{


if(!profileID){


if(user){


profileID=user.uid;


loadProfile(profileID);


}


else{


welcome.innerHTML =
"Guest Profile";


profileDiv.innerHTML = `

<p>
Please sign in to view your profile.
</p>


<a href="login.html">
Sign In
</a>

`;



articlesDiv.innerHTML="";


logout.style.display="none";


}


}


else{


loadProfile(profileID);


}



});









async function loadProfile(userID){



const userDoc =
await getDoc(

doc(db,"users",userID)

);




let username =
"User";



let bio =
"";





if(userDoc.exists()){


const data =
userDoc.data();


username =
data.username || "User";


bio =
data.bio || "";



}







welcome.innerHTML =

`${username}'s Profile 👋`;







profileDiv.innerHTML = `


<h2>

${username}

</h2>



<p>

${bio}

</p>



`;








const q =
query(

collection(db,"articles"),

where("authorID","==",userID)

);






const snapshot =
await getDocs(q);





articlesDiv.innerHTML="";






if(snapshot.empty){


articlesDiv.innerHTML = `

<p>
No articles written yet.
</p>

`;

return;


}






snapshot.forEach((articleDoc)=>{


const article =
articleDoc.data();




articlesDiv.innerHTML += `



<div class="card">



<h3>


<a href="article.html?id=${articleDoc.id}">

${article.title}

</a>


</h3>



<p>

Category:
${article.category}

</p>



</div>



`;



});



}








// LOG OUT


logout.addEventListener("click",()=>{


signOut(auth);


window.location.href="index.html";


});





</script>


</body>

</html>
