<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>







<section class="write-section">



<h1 id="username">
Loading...
</h1>




<div id="profile">

Loading profile...

</div>





<h2>
My Articles
</h2>




<div id="articles">

Loading articles...

</div>





</section>










<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

doc,

getDoc,

collection,

query,

where,

getDocs

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {

getAuth,

onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";







const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);





const username =
document.getElementById("username");


const profile =
document.getElementById("profile");


const articles =
document.getElementById("articles");







onAuthStateChanged(auth,async(user)=>{



if(!user){


profile.innerHTML = `

<p>
You are not signed in.
</p>

<a href="login.html">
Sign In
</a>

`;

return;


}






const userRef =
doc(db,"users",user.uid);



const userSnap =
await getDoc(userRef);





let name =
user.displayName || "User";





if(userSnap.exists()){


name =
userSnap.data().username || name;


}






username.innerHTML =
`${name} 👋`;





profile.innerHTML = `


<h2>
${name}
</h2>


<p>
Email:
${user.email}
</p>


`;









const q =
query(

collection(db,"articles"),

where("authorID","==",user.uid)

);






const snapshot =
await getDocs(q);





articles.innerHTML="";





if(snapshot.empty){


articles.innerHTML =
"<p>No articles written yet.</p>";


return;


}





snapshot.forEach(article=>{


const data =
article.data();



articles.innerHTML += `


<div class="card">


<h3>
${data.title}
</h3>


<p>
Category:
${data.category}
</p>


<a href="article.html?id=${article.id}">
Read Article →
</a>


</div>


`;



});



});





</script>


</body>

</html>
