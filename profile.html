<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>






<section class="write-section">


<h1 id="username">
Loading...
</h1>



<div id="profile">

<p>
Loading profile...
</p>

</div>




<h2>
Articles
</h2>


<div id="articles">

<p>
Loading articles...
</p>

</div>




</section>









<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

doc,

getDoc,

collection,

query,

where,

getDocs

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {

getAuth,

onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";






const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);





const username =
document.getElementById("username");


const profile =
document.getElementById("profile");


const articles =
document.getElementById("articles");





// GET PROFILE ID FROM URL

const params =
new URLSearchParams(window.location.search);


let profileID =
params.get("id");




// IF NO ID, SHOW LOGGED IN USER


if(!profileID){


onAuthStateChanged(auth,(user)=>{


if(user){


loadProfile(user.uid);


}

else{


profile.innerHTML = `

<p>
You must sign in to view your profile.
</p>

<a href="login.html">
Sign In
</a>

`;



}


});



}

else{


loadProfile(profileID);


}









async function loadProfile(uid){



const userRef =
doc(db,"users",uid);



const userSnap =
await getDoc(userRef);



if(!userSnap.exists()){


username.innerHTML="User not found";


return;


}



const user =
userSnap.data();



username.innerHTML =
`${user.username || user.name || "User"} 👋`;





profile.innerHTML = `


<h2>
${user.username || user.name || "User"}
</h2>


<p>
Email:
${user.email}
</p>


<p>
Joined:
${new Date(user.joined.seconds * 1000).toDateString()}
</p>


`;






const q =
query(

collection(db,"articles"),

where("authorID","==",uid)

);




const snapshot =
await getDocs(q);




articles.innerHTML="";



if(snapshot.empty){


articles.innerHTML=
"<p>No articles written yet.</p>";

return;


}





snapshot.forEach(articleDoc=>{


const article =
articleDoc.data();



articles.innerHTML += `


<div class="card">


<h3>
${article.title}
</h3>



<p>
Category:
${article.category}
</p>



<a href="article.html?id=${articleDoc.id}">
Read Article →
</a>


</div>



`;



});



}



</script>


</body>

</html>
