<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>
<a href="profile.html">Profile</a>

</nav>

</header>





<section class="write-section">


<h1 id="welcome">
Loading...
</h1>



<div id="profile">

<p>Loading profile...</p>

</div>




<h2>
My Articles
</h2>


<div id="articles">

<p>Loading articles...</p>

</div>



<br>


<button id="logout">
Log Out
</button>


</section>








<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getAuth,

onAuthStateChanged,

signOut

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {

getFirestore,

collection,

query,

where,

getDocs,

doc,

getDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";






const firebaseConfig = {

apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};






const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);






const profile = document.getElementById("profile");

const articles = document.getElementById("articles");

const welcome = document.getElementById("welcome");






onAuthStateChanged(auth, async(user)=>{


if(user){



// GET USER PROFILE FROM FIRESTORE


const userDoc = await getDoc(
doc(db,"users",user.uid)
);



let username = "User";



if(userDoc.exists()){


username = userDoc.data().name;


}





// WELCOME MESSAGE


welcome.innerHTML =
`Hello ${username} 👋`;







// PROFILE DETAILS


profile.innerHTML = `


<h2>
${username}
</h2>


<p>
Email: ${user.email}
</p>


<p>
Account created:
${new Date(user.metadata.creationTime).toDateString()}
</p>


`;







// LOAD USER ARTICLES


const q = query(

collection(db,"articles"),

where("authorID","==",user.uid)

);





const snapshot = await getDocs(q);





if(snapshot.empty){


articles.innerHTML = `

<p>
No articles written yet.
</p>

`;


return;


}






articles.innerHTML = "";





snapshot.forEach((doc)=>{


const article = doc.data();




articles.innerHTML += `


<div class="card">


<h3>
${article.title}
</h3>


<p>
Category: ${article.category}
</p>


<p>
Status: ${article.status}
</p>


</div>


`;



});






}

else{


welcome.innerHTML =
"Hello Guest 👋";


profile.innerHTML = `


<p>
You must be signed in to view your profile.
</p>


<a href="login.html">
Sign In
</a>


`;



}




});








// LOG OUT


document.getElementById("logout").addEventListener("click",()=>{


signOut(auth);


window.location.href="index.html";


});





</script>



</body>

</html>
