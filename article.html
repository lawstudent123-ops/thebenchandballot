<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Article | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>
<a href="profile.html">Profile</a>

</nav>

</header>





<section class="write-section">


<div id="article">

<p>Loading article...</p>

</div>


<hr>


<h2>
Comments
</h2>



<div>

<textarea id="commentText" placeholder="Write a comment..."></textarea>

<br><br>

<button id="postComment">
Post Comment
</button>


<p id="loginMessage"></p>

</div>



<div id="comments">

<p>Loading comments...</p>

</div>


</section>







<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

doc,

getDoc,

collection,

addDoc,

query,

where,

orderBy,

getDocs

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {

getAuth,

onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";






const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaSyawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);





const articleDiv = document.getElementById("article");

const commentsDiv = document.getElementById("comments");

const commentText = document.getElementById("commentText");

const postComment = document.getElementById("postComment");

const loginMessage = document.getElementById("loginMessage");



const params = new URLSearchParams(window.location.search);

const articleID = params.get("id");



let currentUser = null;





// CHECK LOGIN


onAuthStateChanged(auth,(user)=>{


console.log("AUTH STATUS:", user);



currentUser = user;



if(user){


postComment.disabled = false;


loginMessage.innerHTML =
"";


console.log("Signed in:", user.email);



}


else{


postComment.disabled = true;


loginMessage.innerHTML =
"Sign in to post a comment.";


}


});







// LOAD ARTICLE


async function loadArticle(){


const ref = doc(db,"articles",articleID);


const snapshot = await getDoc(ref);



if(snapshot.exists()){


const article = snapshot.data();



articleDiv.innerHTML = `


<h1>${article.title}</h1>


<p>
<strong>Author:</strong>
${article.authorName}
</p>


<p>
<strong>Category:</strong>
${article.category}
</p>


<hr>


<p>
${article.content}
</p>


`;



}

else{


articleDiv.innerHTML =
"<h2>Article not found</h2>";


}


}




loadArticle();








// ADD COMMENT


postComment.addEventListener("click", async()=>{


if(!currentUser){


alert("Please sign in first.");

return;


}



const text = commentText.value.trim();



if(text===""){


alert("Write a comment first.");

return;


}



await addDoc(collection(db,"comments"),{


articleID: articleID,


text:text,


authorName:

currentUser.displayName || 
currentUser.email.split("@")[0],


date:new Date()


});



commentText.value="";


loadComments();


});










// LOAD COMMENTS


async function loadComments(){


commentsDiv.innerHTML="";



const q = query(

collection(db,"comments"),

where("articleID","==",articleID),

orderBy("date","desc")

);



const snapshot = await getDocs(q);



if(snapshot.empty){


commentsDiv.innerHTML =
"<p>No comments yet.</p>";


return;


}



snapshot.forEach((comment)=>{


const data = comment.data();



commentsDiv.innerHTML += `


<div class="card">


<h3>
${data.authorName}
</h3>


<p>
${data.text}
</p>


</div>


`;


});


}



loadComments();



</script>



</body>

</html>
