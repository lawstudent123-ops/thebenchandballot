<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Articles | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>





<section class="write-section">


<h1>
Published Articles
</h1>


<p>
Explore discussions on law, politics, economics and society.
</p>



<input 
id="search"
type="text"
placeholder="🔍 Search articles..."
>



<br><br>



<div id="articles">

<p>
Loading articles...
</p>

</div>



</section>








<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

query,

where

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};





const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



const articlesDiv =
document.getElementById("articles");


const search =
document.getElementById("search");



let allArticles = [];





async function loadArticles(){


const q = query(

collection(db,"articles"),

where("status","==","APPROVED")

);



const snapshot = await getDocs(q);



allArticles = [];



snapshot.forEach(doc=>{


allArticles.push({

id:doc.id,

...doc.data()

});


});



displayArticles(allArticles);


}







function displayArticles(list){


articlesDiv.innerHTML="";



if(list.length===0){


articlesDiv.innerHTML="<p>No articles found.</p>";

return;


}




list.forEach(article=>{


articlesDiv.innerHTML += `


<div class="card">


<h2>
${article.title}
</h2>



<p>

<strong>Author:</strong>

<a href="profile.html?id=${article.authorID}">
${article.authorName}
</a>

</p>




<p>
Category:
${article.category}
</p>



<p>
${article.content.substring(0,250)}...
</p>



<a href="article.html?id=${article.id}">
Read Article →
</a>



</div>


`;



});


}







search.addEventListener("input",()=>{


const text =
search.value.toLowerCase();



const filtered =
allArticles.filter(article=>

article.title.toLowerCase().includes(text)
||
article.content.toLowerCase().includes(text)

);



displayArticles(filtered);



});





loadArticles();



</script>


</body>

</html>
