<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot

<nav>

<nav>

</nav>

</header>





<section class="write-section">


<h1>
Published Articles
</h1>


<p>
Explore discussions on law, politics, economics and society.
</p>


<input 
id="search"
placeholder="🔍 Search articles..."
>



<div id="articles">

<p>
Loading articles...
</p>

</div>



</section>








<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";



import {

getFirestore,

collection,

query,

where,

getDocs

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";





const firebaseConfig = {

apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const articlesDiv =
document.getElementById("articles");


const search =
document.getElementById("search");



let allArticles = [];






async function loadArticles(){



const q = query(

collection(db,"articles"),

where("status","==","APPROVED")

);



const snapshot =
await getDocs(q);




if(snapshot.empty){


articlesDiv.innerHTML = `

<p>
No approved articles yet.
</p>

`;

return;


}





allArticles=[];



snapshot.forEach((doc)=>{


allArticles.push({

id:doc.id,

...doc.data()

});


});



displayArticles(allArticles);



}





function displayArticles(list){


articlesDiv.innerHTML="";



list.forEach(article=>{


articlesDiv.innerHTML += `


<div class="card">


<h2>

${article.title}

</h2>




<p>

<strong>
Author:
</strong>


<a href="profile.html?id=${article.authorID}">

${article.authorName}

</a>


</p>




<p>

<strong>
Category:
</strong>

${article.category}

</p>





<p>

${article.content.substring(0,250)}...

</p>




<a href="article.html?id=${article.id}">

Read Article →

</a>



</div>



`;



});


}







search.addEventListener("input",()=>{


const value =
search.value.toLowerCase();



const filtered =
allArticles.filter(article=>{


return (

article.title.toLowerCase().includes(value)

||

article.authorName.toLowerCase().includes(value)

||

article.category.toLowerCase().includes(value)

||

article.content.toLowerCase().includes(value)


);


});



displayArticles(filtered);



});







loadArticles();




</script>


</body>

</html>
