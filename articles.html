<section class="write-section">


<h1>
Published Articles
</h1>


<p>
Explore discussions on law, politics, economics and society.
</p>



<div id="articles">

<p>
Loading articles...
</p>

</div>



</section>







<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

collection,

query,

where,

getDocs,

orderBy

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";






const firebaseConfig = {

apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);



const articlesDiv = document.getElementById("articles");






async function loadArticles(){


const q = query(

collection(db,"articles"),

where("status","==","APPROVED")

);




const snapshot = await getDocs(q);





if(snapshot.empty){


articlesDiv.innerHTML = `

<p>
No approved articles yet.
</p>

`;

return;


}




articlesDiv.innerHTML = "";




snapshot.forEach((doc)=>{


const article = doc.data();



articlesDiv.innerHTML += `


<div class="card">


<h2>
${article.title}
</h2>



<p>
<strong>Author:</strong>
${article.authorName}
</p>



<p>
<strong>Category:</strong>
${article.category}
</p>



<p>

${article.content.substring(0,250)}...

</p>



<a href="article.html?id=${doc.id}">
Read Article →
</a>



</div>



`;



});



}





loadArticles();



</script>



</body>

</html>
