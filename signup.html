<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>





<section class="write-section">


<h1>
Create an Account
</h1>


<p>
Join The Bench and Ballot and share your ideas.
</p>




<label>
Username
</label>

<input 
id="username" 
type="text" 
placeholder="Choose a username"
>



<label>
Email
</label>

<input 
id="email" 
type="email" 
placeholder="Enter your email"
>



<label>
Password
</label>

<input 
id="password" 
type="password" 
placeholder="Create a password"
>



<br><br>



<button id="signup" type="button">
Sign Up with Email
</button>





<p>

<a href="#" id="forgot">
Forgot Password?
</a>

</p>





<button id="google" type="button">
Continue with Google
</button>



<p>

Already have an account?

<a href="login.html">
Sign In
</a>

</p>



</section>









<script type="module">



import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";



import {

getAuth,

createUserWithEmailAndPassword,

GoogleAuthProvider,

signInWithPopup,

sendPasswordResetEmail

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";



import {

getFirestore,

doc,

setDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";







const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"


};






const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);








// EMAIL SIGN UP


document
.getElementById("signup")
.addEventListener("click", async()=>{



const username =
document.getElementById("username")
.value
.trim();



const email =
document.getElementById("email")
.value
.trim();



const password =
document.getElementById("password")
.value
.trim();






if(username === ""){


alert("Please choose a username.");

return;


}





if(password.length < 6){


alert("Password must be at least 6 characters.");

return;


}







try{



const result =
await createUserWithEmailAndPassword(

auth,

email,

password

);





const user =
result.user;







// CREATE USER PROFILE


await setDoc(

doc(db,"users",user.uid),

{


username: username,


email: user.email,


bio: "",


joined: new Date()


}


);







alert("Account created successfully!");



window.location.href =
"index.html";




}



catch(error){


alert(error.message);


}




});











// GOOGLE SIGN UP


document
.getElementById("google")
.addEventListener("click", async()=>{



const provider =
new GoogleAuthProvider();





try{



const result =
await signInWithPopup(auth,provider);



const user =
result.user;






await setDoc(

doc(db,"users",user.uid),

{


username:
user.displayName || "Google User",


email:
user.email,


bio:"",


joined:
new Date()


},


{

merge:true

}


);






alert("Signed in with Google!");



window.location.href =
"index.html";




}



catch(error){


alert(error.message);


}




});











// PASSWORD RESET


document
.getElementById("forgot")
.addEventListener("click",()=>{



const email =
document.getElementById("email")
.value
.trim();




if(email===""){


alert("Enter your email first.");

return;


}






sendPasswordResetEmail(auth,email)


.then(()=>{


alert("Password reset email sent.");



})


.catch((error)=>{


alert(error.message);


});




});




</script>



</body>

</html>
