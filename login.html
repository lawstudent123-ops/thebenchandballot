<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>





<section class="write-section">


<h1>
Sign In
</h1>


<p>
Welcome to The Bench and Ballot.
</p>



<button id="google">
Continue with Google
</button>



</section>








<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getAuth,

GoogleAuthProvider,

signInWithPopup

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


import {

getFirestore,

doc,

setDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";






const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};






const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);






document
.getElementById("google")
.addEventListener("click", async()=>{



const provider =
new GoogleAuthProvider();



try{


const result =
await signInWithPopup(auth,provider);



const user =
result.user;





// CREATE / UPDATE USER PROFILE

await setDoc(

doc(db,"users",user.uid),

{


username: user.displayName,

email: user.email,

photo: user.photoURL,

joined: new Date()


},

{
merge:true
}

);





alert("Signed in successfully!");



window.location.href="index.html";



}



catch(error){


alert(error.message);


}



});





</script>


</body>

</html>
