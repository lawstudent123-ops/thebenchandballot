<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | The Bench and Ballot</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
The Bench and Ballot
</div>


<nav>

<a href="index.html">Home</a>
<a href="articles.html">Articles</a>
<a href="write.html">Write</a>
<a href="about.html">About</a>

</nav>

</header>





<section class="write-section">


<h1>
Admin Dashboard 🛡️
</h1>


<p>
Manage articles and comments.
</p>





<h2>
Articles
</h2>


<div id="articles">
Loading articles...
</div>





<h2>
Comments
</h2>


<div id="comments">
Loading comments...
</div>





<h2>
Add Admin Comment
</h2>


<input id="articleID" placeholder="Article ID">


<textarea id="commentText" placeholder="Comment"></textarea>


<br><br>


<button id="addComment">
Add Comment
</button>



</section>









<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

deleteDoc,

doc,

addDoc

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


import {

getAuth,

onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";





const firebaseConfig = {


apiKey: "AIzaSyAW9aKXaFSawt_UnkEsbjS97c4mwO07dKY",

authDomain: "the-bench-and-ballot.firebaseapp.com",

projectId: "the-bench-and-ballot",

storageBucket: "the-bench-and-ballot.firebasestorage.app",

messagingSenderId: "56045247751",

appId: "1:56045247751:web:22b9dcb631f3e95d2179a2"

};






const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);






const ADMIN_UID =
"bQpL4AEK1jc6bsrtJ3i8nVsXKG23";






onAuthStateChanged(auth,(user)=>{


if(!user || user.uid !== ADMIN_UID){


alert("Access denied");


window.location.href="index.html";


}


});







const articles =
document.getElementById("articles");


const comments =
document.getElementById("comments");







// LOAD ARTICLES


async function loadArticles(){


articles.innerHTML="";


const snapshot =
await getDocs(collection(db,"articles"));



if(snapshot.empty){


articles.innerHTML =
"<p>No articles.</p>";


return;


}



snapshot.forEach(article=>{


const data =
article.data();



articles.innerHTML += `


<div class="card">


<h3>
${data.title}
</h3>


<p>
Author:
${data.authorName}
</p>


<p>
Status:
${data.status}
</p>


<button onclick="deleteArticle('${article.id}')">

Delete Article

</button>


</div>


`;


});


}







window.deleteArticle = async(id)=>{


if(confirm("Delete this article?")){


await deleteDoc(
doc(db,"articles",id)
);


alert("Article deleted");


loadArticles();


}


};









// LOAD COMMENTS


async function loadComments(){


comments.innerHTML="";


const snapshot =
await getDocs(collection(db,"comments"));



if(snapshot.empty){


comments.innerHTML =
"<p>No comments.</p>";


return;


}



snapshot.forEach(comment=>{


const data =
comment.data();



comments.innerHTML += `


<div class="card">


<p>
<strong>${data.authorName}</strong>
</p>


<p>
${data.text}
</p>



<button onclick="deleteComment('${comment.id}')">

Delete Comment

</button>


</div>


`;


});


}








window.deleteComment = async(id)=>{


if(confirm("Delete this comment?")){


await deleteDoc(
doc(db,"comments",id)
);


alert("Comment deleted");


loadComments();


}


};









// ADD ADMIN COMMENT


document
.getElementById("addComment")
.addEventListener("click",async()=>{


const articleID =
document.getElementById("articleID").value.trim();


const text =
document.getElementById("commentText").value.trim();



if(!articleID || !text){


alert("Fill in both fields");


return;


}




await addDoc(collection(db,"comments"),{


articleID:articleID,


text:text,


authorName:"Admin",


userID:ADMIN_UID,


date:new Date()


});




alert("Comment added!");



document.getElementById("commentText").value="";


loadComments();


});






loadArticles();

loadComments();




</script>



</body>

</html>
